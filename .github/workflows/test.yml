name: Node.js Tests

on:
  push:
    branches: [ "202310370311252-Rifqi-Maulana-Ishak" ]
  pull_request:
    branches: [ "202310370311252-Rifqi-Maulana-Ishak" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Run Tests
      run: npm test
